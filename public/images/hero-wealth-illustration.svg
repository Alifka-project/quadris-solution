<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4146a7;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4146a7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background circles -->
  <circle cx="400" cy="400" r="350" fill="url(#grad1)" opacity="0.3"/>
  <circle cx="400" cy="400" r="280" fill="none" stroke="#4146a7" stroke-width="1" opacity="0.1"/>
  <circle cx="400" cy="400" r="220" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.1"/>
  
  <!-- Central vault/safe icon -->
  <g transform="translate(300, 250)">
    <rect x="0" y="0" width="200" height="220" rx="12" fill="url(#grad2)" opacity="0.1"/>
    <rect x="10" y="10" width="180" height="200" rx="8" fill="white" stroke="#4146a7" stroke-width="2"/>
    
    <!-- Vault door -->
    <circle cx="100" cy="110" r="60" fill="none" stroke="url(#grad2)" stroke-width="4"/>
    <circle cx="100" cy="110" r="45" fill="none" stroke="#4146a7" stroke-width="3"/>
    <circle cx="100" cy="110" r="30" fill="#4146a7" opacity="0.1"/>
    
    <!-- Vault handle -->
    <circle cx="100" cy="110" r="15" fill="url(#grad2)"/>
    <line x1="85" y1="110" x2="115" y2="110" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="95" x2="100" y2="125" stroke="white" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Security bars -->
    <rect x="30" y="180" width="140" height="4" rx="2" fill="#4146a7" opacity="0.3"/>
    <rect x="30" y="190" width="140" height="4" rx="2" fill="#00d4ff" opacity="0.3"/>
  </g>
  
  <!-- Money/Asset symbols floating around -->
  <!-- Dollar symbol top left -->
  <g transform="translate(150, 180)">
    <circle cx="0" cy="0" r="35" fill="white" stroke="url(#grad2)" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#grad2)">$</text>
  </g>
  
  <!-- Euro symbol top right -->
  <g transform="translate(650, 200)">
    <circle cx="0" cy="0" r="35" fill="white" stroke="url(#grad2)" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#grad2)">€</text>
  </g>
  
  <!-- Chart/Growth icon bottom left -->
  <g transform="translate(120, 580)">
    <rect x="0" y="0" width="120" height="100" rx="8" fill="white" stroke="url(#grad2)" stroke-width="2"/>
    <polyline points="15,70 35,55 55,45 75,25 95,15" fill="none" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15" cy="70" r="4" fill="#4146a7"/>
    <circle cx="35" cy="55" r="4" fill="#4146a7"/>
    <circle cx="55" cy="45" r="4" fill="#00d4ff"/>
    <circle cx="75" cy="25" r="4" fill="#00d4ff"/>
    <circle cx="95" cy="15" r="4" fill="#00d4ff"/>
    <rect x="10" y="80" width="10" height="10" rx="2" fill="#4146a7" opacity="0.3"/>
    <rect x="30" y="75" width="10" height="15" rx="2" fill="#4146a7" opacity="0.4"/>
    <rect x="50" y="68" width="10" height="22" rx="2" fill="#00d4ff" opacity="0.4"/>
    <rect x="70" y="60" width="10" height="30" rx="2" fill="#00d4ff" opacity="0.5"/>
    <rect x="90" y="50" width="10" height="40" rx="2" fill="#00d4ff" opacity="0.6"/>
  </g>
  
  <!-- Portfolio/Document icon bottom right -->
  <g transform="translate(580, 560)">
    <rect x="0" y="0" width="140" height="120" rx="8" fill="white" stroke="url(#grad2)" stroke-width="2"/>
    <rect x="15" y="20" width="110" height="8" rx="4" fill="#4146a7" opacity="0.2"/>
    <rect x="15" y="38" width="90" height="6" rx="3" fill="#4146a7" opacity="0.15"/>
    <rect x="15" y="50" width="100" height="6" rx="3" fill="#4146a7" opacity="0.15"/>
    <rect x="15" y="70" width="110" height="8" rx="4" fill="#00d4ff" opacity="0.2"/>
    <rect x="15" y="88" width="80" height="6" rx="3" fill="#00d4ff" opacity="0.15"/>
    <rect x="15" y="100" width="95" height="6" rx="3" fill="#00d4ff" opacity="0.15"/>
  </g>
  
  <!-- Coin stack middle left -->
  <g transform="translate(180, 420)">
    <ellipse cx="0" cy="0" rx="30" ry="8" fill="url(#grad2)" opacity="0.8"/>
    <rect x="-30" y="-25" width="60" height="25" fill="#4146a7" opacity="0.2"/>
    <ellipse cx="0" cy="-25" rx="30" ry="8" fill="url(#grad2)" opacity="0.9"/>
    <rect x="-30" y="-45" width="60" height="20" fill="#00d4ff" opacity="0.2"/>
    <ellipse cx="0" cy="-45" rx="30" ry="8" fill="url(#grad2)"/>
  </g>
  
  <!-- Shield/Security icon top center -->
  <g transform="translate(400, 100)">
    <path d="M 0,-40 L 25,-30 L 25,5 Q 25,20 0,35 Q -25,20 -25,5 L -25,-30 Z" fill="white" stroke="url(#grad2)" stroke-width="2"/>
    <path d="M 0,-30 L 18,-22 L 18,3 Q 18,15 0,27 Q -18,15 -18,3 L -18,-22 Z" fill="url(#grad3)"/>
    <path d="M -8,0 L -3,8 L 8,-8" fill="none" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Pie chart icon middle right -->
  <g transform="translate(620, 380)">
    <circle cx="0" cy="0" r="45" fill="white" stroke="url(#grad2)" stroke-width="2"/>
    <path d="M 0,0 L 0,-40 A 40,40 0 0,1 34.64,-20 Z" fill="#4146a7" opacity="0.4"/>
    <path d="M 0,0 L 34.64,-20 A 40,40 0 0,1 34.64,20 Z" fill="#00d4ff" opacity="0.4"/>
    <path d="M 0,0 L 34.64,20 A 40,40 0 0,1 -34.64,20 Z" fill="#7c3aed" opacity="0.3"/>
    <path d="M 0,0 L -34.64,20 A 40,40 0 0,1 0,-40 Z" fill="#00d4ff" opacity="0.2"/>
  </g>
  
  <!-- Connection lines (subtle) -->
  <line x1="400" y1="350" x2="150" y2="180" stroke="#4146a7" stroke-width="1" opacity="0.1" stroke-dasharray="5,5"/>
  <line x1="400" y1="350" x2="650" y2="200" stroke="#00d4ff" stroke-width="1" opacity="0.1" stroke-dasharray="5,5"/>
  <line x1="400" y1="470" x2="180" y2="580" stroke="#4146a7" stroke-width="1" opacity="0.1" stroke-dasharray="5,5"/>
  <line x1="400" y1="470" x2="650" y2="620" stroke="#00d4ff" stroke-width="1" opacity="0.1" stroke-dasharray="5,5"/>
</svg>
